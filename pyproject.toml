[project]
name = "cta-orange"
version = "0.1.1"
description = "Orange Canvas add-on for authoring and executing Computational Text Analysis workflows with CTA Kernel"
readme = "README.md"
authors = [
    { name = "Colin Luginbühl" },
    { name = "Aris Xanthos" },
]
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyqt==0.2.1",
    "numpy==2.3.5",
    "orange3==3.40.0",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
    "cta-kernel==0.1.0"
]

[project.urls]
Repository = "https://github.com/ColinLug/cta_orange"
Documentation = "https://github.com/ColinLug/cta_orange/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cta_orange"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "setuptools==65.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.entry-points."orange3.addon"]
"cta-orange" = "cta_orange"

[project.entry-points."orange.widgets"]
"CTA" = "cta_orange.widgets"
